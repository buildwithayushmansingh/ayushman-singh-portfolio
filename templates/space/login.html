<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Personal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('siteTheme');if(t&&t!=='cinematic')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/space.css') }}">
</head>
<body class="sp-login-body">
  <main class="sp-login">
    <div class="sp-login-card">
      <div class="sp-login-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      </div>
      <h1>Personal Space</h1>
      <p class="sp-login-sub">Private area. Enter your password to continue.</p>

      <form method="post" action="{{ url_for('space.login') }}" autocomplete="off">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label class="sp-label" for="spPassword">PASSWORD</label>
        <input class="sp-input" id="spPassword" name="password" type="password" autocomplete="current-password" autofocus required>
        {% if error %}<div class="sp-error" role="alert">{{ error }}</div>{% endif %}
        <button class="sp-btn sp-btn-primary sp-btn-block" type="submit">Unlock</button>
      </form>
      <a class="sp-back" href="{{ url_for('home') }}">← Back to portfolio</a>
    </div>
  </main>
</body>
</html>
