<!-- AI portfolio assistant — floating button + chat panel (streaming, cards, voice, feedback) -->
<button type="button" class="ai-fab" id="aiFab" aria-haspopup="dialog" aria-expanded="false" aria-label="Open portfolio AI assistant (Ctrl+/)" data-cursor-text="Ask AI">
  <span class="ai-fab-icon">🤖</span>
  <span class="ai-fab-label">Ask AI</span>
</button>

<div class="ai-panel" id="aiPanel" role="dialog" aria-modal="false" aria-label="Portfolio AI assistant" hidden>
  <div class="ai-panel-header">
    <span class="ai-panel-title">🤖 Portfolio AI <span class="ai-online-dot" title="Online"></span></span>
    <span class="ai-panel-actions">
      <button type="button" class="ai-panel-clear" id="aiPanelClear" aria-label="Clear chat" title="Clear chat">⟲</button>
      <button type="button" class="ai-panel-close" id="aiPanelClose" aria-label="Close AI assistant">×</button>
    </span>
  </div>

  <div class="ai-panel-body" id="aiPanelBody" aria-live="polite">
    <div class="ai-msg ai-msg-bot">
      <div class="ai-msg-text">Hi! I'm your portfolio assistant.<br>Ask me about the developer, projects, skills, certificates or journey — or try <b>"switch to light theme"</b>.</div>
    </div>
  </div>

  <div class="ai-counter" id="aiCounter" hidden></div>
  <form class="ai-panel-input-row" id="aiForm">
    <input type="text" id="aiInput" class="ai-input" placeholder="Ask something..." maxlength="500" autocomplete="off" aria-label="Ask the portfolio AI assistant">
    <button type="button" class="ai-mic-btn" id="aiMic" aria-label="Speak your question" title="Speak" hidden>🎤</button>
    <button type="submit" class="ai-send-btn" aria-label="Send">➤</button>
  </form>
</div>
